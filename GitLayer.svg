<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Apple-style Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    
    <!-- Subtle Inner Shadow & Glow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.15" flood-type="inner"/>
    </filter>

    <!-- Figma Color Gradients -->
    <linearGradient id="figmaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7262"/>
      <stop offset="100%" stop-color="#F24E1E"/>
    </linearGradient>
    <linearGradient id="figmaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B875FF"/>
      <stop offset="100%" stop-color="#A259FF"/>
    </linearGradient>
    <linearGradient id="figmaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ABCFE"/>
      <stop offset="100%" stop-color="#0ACF83"/>
    </linearGradient>
    <linearGradient id="figmaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB5E"/>
      <stop offset="100%" stop-color="#FF7262"/>
    </linearGradient>
  </defs>

  <!-- iOS / macOS Style Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#3A3A3C" stroke-width="2"/>

  <!-- Connecting Branch Paths (Git Topology styled like Figma layout vectors) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Trunk to Left Branch -->
    <path d="M220 340 V 230 C 220 190, 160 190, 160 150" stroke="#3A3A3C" stroke-width="16"/>
    <path d="M220 340 V 230 C 220 190, 160 190, 160 150" stroke="url(#figmaBlue)" stroke-width="8" stroke-dasharray="400" stroke-dashoffset="0"/>

    <!-- Main Trunk to Right Branch -->
    <path d="M220 340 V 270 C 220 270, 350 270, 350 190" stroke="#3A3A3C" stroke-width="16"/>
    <path d="M220 340 V 270 C 220 270, 350 270, 350 190" stroke="url(#figmaPurple)" stroke-width="8"/>
  </g>

  <!-- Git Node Circles (Figma Component/Anchor Points) -->
  <!-- Bottom Node (Trunk / Origin) -->
  <circle cx="220" cy="356" r="28" fill="url(#figmaRed)" filter="url(#shadow)"/>
  <circle cx="220" cy="356" r="12" fill="#1C1C1E"/>

  <!-- Left Node (Feature Branch A / Blue) -->
  <circle cx="160" cy="134" r="28" fill="url(#figmaBlue)" filter="url(#shadow)"/>
  <circle cx="160" cy="134" r="12" fill="#1C1C1E"/>

  <!-- Right Node (Feature Branch B / Purple) -->
  <circle cx="352" cy="174" r="28" fill="url(#figmaPurple)" filter="url(#shadow)"/>
  <circle cx="352" cy="174" r="12" fill="#1C1C1E"/>
  
  <!-- Center Merge / Anchor Node (Orange) -->
  <circle cx="220" cy="230" r="20" fill="url(#figmaOrange)" filter="url(#shadow)"/>
  <circle cx="220" cy="230" r="8" fill="#1C1C1E"/>
</svg>
